# GitHub Pages serves the gh-pages branch. Edit on main; this keeps
# gh-pages identical to main after every push.
name: Sync gh-pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
